name: Windows companion & browser tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      # The release for this version takes its title and notes from CHANGELOG.md; fail now, before any tag, if it has none.
      - name: CHANGELOG has a section for this version
        shell: pwsh
        run: node scripts/release-notes.mjs "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)" release-notes-check.md
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: dotnet test companion/tests/SoundpadWeb.Tests.csproj -c Release --logger GitHubActions
      - run: dotnet build companion/harness/SoundpadWeb.Harness.csproj -c Release
      # Backups (2.44): back up a fixture library, delete and damage it, restore it and compare every byte. The folder
      # must be under the user's temp folder (GetTempPath), not RUNNER_TEMP.
      - name: Backup round trip (harness)
        shell: pwsh
        run: |
          $dir = Join-Path ([IO.Path]::GetTempPath()) "soundpad-web-backup-roundtrip"
          & companion/harness/bin/Release/net10.0-windows10.0.19041.0/win-x64/SoundpadWeb.Harness.exe --backup-roundtrip $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Voice Replay Studio (mimic/) build and tests
        run: dotnet run --project mimic/tests/VoiceReplay.Tests -c Release
      # UpdateRepository (2.44): the release EXE updates itself from this repository's releases; other builds never do.
      - name: Publish portable companion
        run: dotnet publish companion/SoundpadWeb.Companion.csproj -c Release -r win-x64 --self-contained true -o artifacts/release "-p:WebsiteUrl=$env:PUBLIC_WEBSITE_URL" "-p:UpdateRepository=$env:UPDATE_REPOSITORY"
        env:
          PUBLIC_WEBSITE_URL: ${{ vars.SOUNDPAD_WEB_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          UPDATE_REPOSITORY: ${{ github.repository }}
      - run: ./scripts/smoke-exe.ps1 -UseEmbeddedWebsite
      # The self-update (2.44) end to end with a local fake release server: the swap, the verification refusals and the
      # rollback of a new version that never starts. Publishes a "new" build (version + 1) into a temp folder.
      - name: Self-update swap test
        shell: powershell
        run: ./scripts/update-swap-test.ps1 -Exe artifacts/release/SoundpadWeb.exe
      # 2.48: the same EXE twice, as SoundpadWeb.exe (what companions 2.44-2.47 update from and what
      # releases/latest/download/SoundpadWeb.exe links to) and SoundpadWeb-<version>.exe (a hyphen: GitHub turns spaces
      # in asset names into dots). SHA256.txt stays the bare hash, the only form 2.44-2.47 accept; SHA256SUMS.txt names
      # both files. See docs/UPDATES.md.
      - name: Hash portable executable and add its versioned copy
        shell: pwsh
        run: |
          $exe = 'artifacts/release/SoundpadWeb.exe'
          $version = ((Get-Item -LiteralPath $exe).VersionInfo.ProductVersion -split '\+')[0]
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected companion version '$version'" }
          $versioned = "SoundpadWeb-$version.exe"
          Copy-Item -LiteralPath $exe -Destination "artifacts/release/$versioned"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath "artifacts/release/$versioned" -Algorithm SHA256).Hash -ne $hash) { throw "$versioned differs from SoundpadWeb.exe" }
          $hash | Set-Content artifacts/release/SHA256.txt
          "$hash  SoundpadWeb.exe`n$hash  $versioned`n" | Set-Content -NoNewline artifacts/release/SHA256SUMS.txt
          Get-Content artifacts/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: SoundpadWeb-win-x64
          path: artifacts/release/
      - uses: actions/upload-artifact@v7
        with:
          name: SoundpadWeb-static
          path: dist/
  browser:
    name: Browser (${{ matrix.engine }}, ${{ matrix.shard }}/4)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        shard: [1, 2, 3, 4]
    env:
      TEST_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      # The synthetic HTTPS test serves the production bundle from dist/.
      - run: npm run build
      - run: dotnet build companion/harness/SoundpadWeb.Harness.csproj -c Release
      - run: npx playwright install ${{ matrix.engine }}
      # Each shard runs one worker with its own Vite server and mock companion on a dedicated runner.
      - run: npm run test:e2e -- --fully-parallel --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-evidence-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            test-results/
            artifacts/screenshots/
            artifacts/v2/*metrics.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, browser]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # CHANGELOG.md gives each release its version-numbered title and notes (scripts/release-notes.mjs).
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: SoundpadWeb-win-x64
          path: release
      - name: Publish tagged release assets
        shell: pwsh
        run: |
          $title = node scripts/release-notes.mjs $env:RELEASE_TAG release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Both EXE names (2.48), and the tag must be the EXE's own version.
          $versioned = "release/SoundpadWeb-$($env:RELEASE_TAG.TrimStart('v')).exe"
          if (-not (Test-Path -LiteralPath $versioned)) { throw "$versioned is missing: the tag does not match the companion's version" }
          gh release create $env:RELEASE_TAG release/SoundpadWeb.exe $versioned release/SHA256.txt release/SHA256SUMS.txt --repo $env:REPOSITORY --title "$title" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
