name: Windows companion & browser tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: dotnet test companion/tests/SoundpadWeb.Tests.csproj -c Release
      - run: dotnet build companion/harness/SoundpadWeb.Harness.csproj -c Release
      - name: Voice Replay Studio (mimic/) build and tests
        run: dotnet run --project mimic/tests/VoiceReplay.Tests -c Release
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Publish portable companion
        run: dotnet publish companion/SoundpadWeb.Companion.csproj -c Release -r win-x64 --self-contained true -o artifacts/release "-p:WebsiteUrl=$env:PUBLIC_WEBSITE_URL"
        env:
          PUBLIC_WEBSITE_URL: ${{ vars.SOUNDPAD_WEB_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - run: ./scripts/smoke-exe.ps1 -UseEmbeddedWebsite
      - name: Hash portable executable
        shell: pwsh
        run: (Get-FileHash artifacts/release/SoundpadWeb.exe -Algorithm SHA256).Hash | Set-Content artifacts/release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SoundpadWeb-win-x64
          path: artifacts/release/
      - uses: actions/upload-artifact@v4
        with:
          name: SoundpadWeb-static
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            test-results/
            artifacts/screenshots/
            artifacts/v2/*metrics.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SoundpadWeb-win-x64
          path: release
      - name: Publish tagged release assets
        shell: pwsh
        run: gh release create $env:RELEASE_TAG release/SoundpadWeb.exe release/SHA256.txt --repo $env:REPOSITORY --generate-notes --title "Soundpad Web $env:RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
