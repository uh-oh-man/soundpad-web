name: Live relay guest tests
# Guests reach hosts through public Nostr relays and WebRTC. The normal CI never depends on them, so this
# weekly run (and any manual run) exercises real guest browsers over the real relays, so that relay or
# library changes that break joining show up here instead of in someone's session.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/live-relay.yml
permissions:
  contents: read
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: dotnet build companion/harness/SoundpadWeb.Harness.csproj -c Release
      - run: npx playwright install chromium
      - name: Live Nostr/WebRTC tests (real public relays, mock Soundpad, no real audio)
        run: npx playwright test --grep "live Nostr"
        env:
          LIVE_RELAY: '1'
