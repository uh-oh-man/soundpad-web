name: Second-network Soundpad proof
run-name: Second-network Soundpad proof (${{ inputs.peer }})
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Base64 DER RSA public key used to seal the fixture invitation
        required: true
        type: string
      peer:
        description: Unique guest display name for this test
        required: true
        type: string
permissions:
  contents: read
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      SOUNDPAD_PROBE_PUBLIC_KEY: ${{ inputs.public_key }}
      SOUNDPAD_PROBE_PEER: ${{ inputs.peer }}
      LIVE_RELAY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: dotnet build companion/harness/SoundpadWeb.Harness.csproj -c Release
      - run: npx playwright install chromium
      - run: npm install --prefix .github/actions/second-network-host --no-save --package-lock=false --no-audit @actions/artifact@6.3.1
      - uses: ./.github/actions/second-network-host
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: second-network-result
          path: artifacts/second-network/result.json
          if-no-files-found: ignore
          retention-days: 1
